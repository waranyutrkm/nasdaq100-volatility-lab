name: Nasdaq-100 Daily Volatility Sync

on:
  schedule:
    # Run at 21:30 UTC Mon-Fri (16:30 EST, 30 mins after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Fetch Latest Market Data & Compute Volatility Indicators
        run: |
          python scripts/fetch_latest_nasdaq.py 15d

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in market data to commit."
          else
            git commit -m "chore(data): auto-sync nasdaq-100 volatility snapshot [skip ci]"
            git push
          fi
